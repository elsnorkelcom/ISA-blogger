// 2. MOTOR DE PERSISTENCIA SOBERANA (isa-progress-v1)
// =============================================================================
const STORAGE_KEY = 'isa-progress-v1';
const CONFIG_KEY = 'isa-config-v1';

class ProgressStore {
  static getInitialState() {
    return {
      version: 1,
      callsign: 'LUNAR FISH #884',
      points: 450,
      streak: 5,
      bestStreak: 7,
      completedMissions: ['acero-1', 'acero-2', 'acero-3', 'cobre-1', 'cobre-2', 'cobre-7', 'cobre-8'],
      badges: ['BDG-AC-01', 'BDG-AC-02', 'BDG-COB-SCI-MAQ', 'BDG-COB-TEC-MAQ'],
      lastSync: new Date().toISOString(),
      lang: 'es',
      theme: 'day'
    };
  }

  static read() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : this.getInitialState();
    } catch {
      return this.getInitialState();
    }
  }

  static write(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      this.updateHeaderTelemetry(data);
    } catch (e) {
      console.warn('Storage quota or disabled', e);
    }
  }

  static purge() {
    localStorage.removeItem(STORAGE_KEY);
    return this.getInitialState();
  }

  static updateHeaderTelemetry(data) {
    const callsignElem = document.getElementById('callsign-badge');
    if (callsignElem) {
      callsignElem.textContent = `EXP · ${data.callsign}`;
    }
  }
}

// =============================================================================
// 3. ENRUTADOR CLIENTE SPA (12 RUTAS OFICIALES)
// =============================================================================
class AppRouter {
  constructor(routes) {
    this.routes = routes;
    this.currentRoute = null;
    this.viewport = document.getElementById('router-view');
    window.addEventListener('hashchange', () => this.handleHashChange());
  }

  init() {
    if (!window.location.hash) {
      window.location.hash = '#/home';
    } else {
      this.handleHashChange();
    }
  }

  navigate(path) {
    window.location.hash = `#${path}`;
  }

  handleHashChange() {
    const hash = window.location.hash.slice(1) || '/home';
    const [path] = hash.split('?');
    const matchedRoute = this.routes[path] || this.routes['/home'];

    // Actualizar pestañas activas
    document.querySelectorAll('.nav-tab').forEach(tab => {
      const routeAttr = tab.getAttribute('data-route');
      tab.classList.toggle('active', routeAttr === path);
    });

    this.currentRoute = path;
    this.viewport.innerHTML = '';
    const component = matchedRoute();
    this.viewport.appendChild(component);
    window.scrollTo(0, 0);
  }
}

// =============================================================================
// 5. INICIALIZACIÓN GLOBAL DE APLICACIÓN
// =============================================================================
document.addEventListener('DOMContentLoaded', () => {
  const state = ProgressStore.read();
  ProgressStore.updateHeaderTelemetry(state);

  // Inicializar Tema (Day / Night Ops)
  const currentTheme = localStorage.getItem('isa-theme') || state.theme || 'day';
  document.documentElement.setAttribute('data-theme', currentTheme);

  const nightOpsBtn = document.getElementById('night-ops-btn');
  if (nightOpsBtn) {
    nightOpsBtn.addEventListener('click', () => {
      const activeTheme = document.documentElement.getAttribute('data-theme');
      const nextTheme = activeTheme === 'night' ? 'day' : 'night';
      document.documentElement.setAttribute('data-theme', nextTheme);
      localStorage.setItem('isa-theme', nextTheme);
    });
  }

  // Inicializar Conmutador Bilingüe
  let currentLang = localStorage.getItem('isa-lang') || state.lang || 'es';
  const langToggleBtn = document.getElementById('lang-toggle-btn');
  const langLabel = document.getElementById('lang-label');

  function updateLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('isa-lang', lang);
    if (langLabel) langLabel.textContent = lang.toUpperCase();

    document.querySelectorAll('[data-i18n]').forEach(elem => {
      const key = elem.getAttribute('data-i18n');
      if (I18N[lang] && I18N[lang][key]) {
        elem.textContent = I18N[lang][key];
      }
    });
  }

  if (langToggleBtn) {
    langToggleBtn.addEventListener('click', () => {
      updateLanguage(currentLang === 'es' ? 'en' : 'es');
    });
  }
  updateLanguage(currentLang);

  // Modal Elena Intercom Handler
  const closeElenaBtn = document.getElementById('close-elena-btn');
  const elenaModal = document.getElementById('elena-intercom-modal');
  if (closeElenaBtn && elenaModal) {
    closeElenaBtn.addEventListener('click', () => {
      elenaModal.classList.remove('open');
    });
  }

  // Navegación Bottom Bar
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const targetRoute = tab.getAttribute('data-route');
      window.location.hash = `#${targetRoute}`;
    });
  });

  // Configurar Router y Rutas
  const router = new AppRouter({
    '/home': renderHomeView,
    '/map': renderMapView,
    '/badges': renderBadgesView,
    '/museums': renderMuseumsView,
    '/profile': renderProfileView,
    '/episode/cobre-1': renderEpisodeChallengeView
  });

  router.init();
});
